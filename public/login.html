<!DOCTYPE html>
<html lang="sr" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#edeeee"/>
  <title>Prijava - Kragujevac Sport</title>
  <meta name="robots" content="noindex, nofollow"/>
  <script src="/js/site.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Fira+Sans+Condensed:wght@800&family=Fira+Sans+Extra+Condensed:wght@900&display=swap"/>
  <link rel="stylesheet" href="/css/site.css"/>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
  <link rel="apple-touch-icon" href="/mililogo.png"/>
</head>
<body class="auth-view">

<div class="colorbar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>

<header class="site-header">
  <div class="wrap header-row">
    <a href="/" class="brand" aria-label="Kragujevac Sport, početna">
      <img src="/img/logo.webp" alt="" width="401" height="180"/>
    </a>
    <div class="header-actions">
      <button class="icon-btn" data-theme-toggle title="Promeni temu" aria-label="Promeni temu">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7z"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="page-main auth-page">
  <div class="auth-card" data-reveal>
    <h1 class="auth-title">Nalog</h1>
    <p class="auth-sub">Prijavite se da biste komentarisali vesti.</p>

    <div class="auth-tabs" role="tablist">
      <button class="auth-tab active" id="loginTab" data-tab="login" role="tab" aria-selected="true" aria-controls="tab-login" tabindex="0">Prijava</button>
      <button class="auth-tab" id="registerTab" data-tab="register" role="tab" aria-selected="false" aria-controls="tab-register" tabindex="-1">Registracija</button>
    </div>

    <!-- LOGIN -->
    <div class="auth-tab-content active" id="tab-login" role="tabpanel" aria-labelledby="loginTab">
      <form id="loginForm" autocomplete="on" novalidate>
        <div class="form-group">
          <label for="loginUsername">Korisničko ime</label>
          <input type="text" id="loginUsername" placeholder="tvoj_nick" autocomplete="username" required/>
        </div>
        <div class="form-group">
          <label for="loginPassword">Lozinka</label>
          <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required/>
        </div>
        <button type="submit" class="btn full" id="loginBtn" style="--bs:var(--red)">Prijavi se</button>
        <div class="error-msg" id="loginError" role="alert"></div>
      </form>
    </div>

    <!-- REGISTER -->
    <div class="auth-tab-content" id="tab-register" role="tabpanel" aria-labelledby="registerTab">
      <form id="registerForm" autocomplete="on" novalidate>
        <div class="form-group">
          <label for="registerUsername">Korisničko ime</label>
          <input type="text" id="registerUsername" placeholder="npr. Nikola" autocomplete="username" required maxlength="30" aria-describedby="registerUsernameHint"/>
          <div class="hint" id="registerUsernameHint">Prikazuje se pored tvojih komentara. Samo slova, brojevi i _ . -</div>
        </div>
        <div class="form-group">
          <label for="registerPassword">Lozinka</label>
          <input type="password" id="registerPassword" placeholder="Minimalno 6 znakova" autocomplete="new-password" required minlength="6"/>
        </div>
        <button type="submit" class="btn full" id="registerBtn" style="--bs:var(--red)">Napravi nalog</button>
        <div class="error-msg" id="registerError" role="alert"></div>
        <div class="success-msg" id="registerSuccess" role="status"></div>
        <p class="auth-legal">
          Kreiranjem naloga prihvataš našu <a href="/privacy-policy">Politiku privatnosti</a>.
        </p>
      </form>
    </div>

    <a href="/" class="auth-back">Povratak na vesti</a>
  </div>
</main>

<footer class="site-footer">
  <div class="colorbar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="wrap footer-bottom">
    <span>© <span data-year></span> Kragujevac Sport</span>
    <span><a href="/kontakt">Kontakt</a> &nbsp; <a href="/privacy-policy">Politika privatnosti</a></span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL  = 'https://djhrxrhucwfygnjvkqyl.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqaHJ4cmh1Y3dmeWduanZrcXlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQzOTAzMTYsImV4cCI6MjA4OTk2NjMxNn0.APKFBCb4PfuPoiD4c4p5AdUWe6aXpZZ3eFvifPuzvpw';

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
  const returnUrl = new URLSearchParams(location.search).get('return') || '/';

  function setCookie(rt) {
    document.cookie = 'ks_rt=' + encodeURIComponent(rt) + '; max-age=2592000; path=/; SameSite=Lax';
  }

  // If already logged in (localStorage or cookie), redirect immediately
  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (session) { location.href = returnUrl; return; }

    // Try cookie
    const match = document.cookie.match(/(?:^|;\s*)ks_rt=([^;]+)/);
    if (match) {
      try {
        const { data } = await sb.auth.refreshSession({ refresh_token: decodeURIComponent(match[1]) });
        if (data?.session) {
          setCookie(data.session.refresh_token);
          location.href = returnUrl;
          return;
        }
      } catch (_) {}
      document.cookie = 'ks_rt=; max-age=0; path=/; SameSite=Lax';
    }
  })();

  // ─── TABS ────────────────────────────────────────────────────────────────
  document.querySelectorAll('.auth-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.auth-tab').forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-selected', 'false');
        b.setAttribute('tabindex', '-1');
      });
      document.querySelectorAll('.auth-tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      btn.setAttribute('aria-selected', 'true');
      btn.setAttribute('tabindex', '0');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });

  document.querySelector('.auth-tabs').addEventListener('keydown', (event) => {
    if (!['ArrowLeft', 'ArrowRight'].includes(event.key)) return;
    event.preventDefault();
    const tabs = Array.from(document.querySelectorAll('.auth-tab'));
    const current = tabs.indexOf(document.activeElement);
    const next = event.key === 'ArrowRight'
      ? (current + 1) % tabs.length
      : (current - 1 + tabs.length) % tabs.length;
    tabs[next].click();
    tabs[next].focus();
  });

  function showErr(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg; el.style.display = 'block';
  }
  function hideMsg(id) { document.getElementById(id).style.display = 'none'; }

  // ─── LOGIN ───────────────────────────────────────────────────────────────
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideMsg('loginError');
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;
    const btn      = document.getElementById('loginBtn');
    if (!username || !password) return showErr('loginError', 'Unesite korisničko ime i lozinku.');
    btn.disabled = true; btn.textContent = 'Prijavljivanje...';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (!res.ok) {
        showErr('loginError', data.error || 'Greška pri prijavi.');
        btn.disabled = false; btn.textContent = 'Prijavi se';
        return;
      }
      // Set Supabase session client-side
      await sb.auth.setSession({ access_token: data.session.access_token, refresh_token: data.session.refresh_token });
      setCookie(data.session.refresh_token);
      location.href = returnUrl;
    } catch (_) {
      showErr('loginError', 'Greška pri prijavi. Pokušaj ponovo.');
      btn.disabled = false; btn.textContent = 'Prijavi se';
    }
  });

  // ─── REGISTER ────────────────────────────────────────────────────────────
  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideMsg('registerError');
    hideMsg('registerSuccess');
    const username = document.getElementById('registerUsername').value.trim();
    const password = document.getElementById('registerPassword').value;
    const btn      = document.getElementById('registerBtn');

    if (!username) return showErr('registerError', 'Unesite korisničko ime.');
    if (password.length < 6) return showErr('registerError', 'Lozinka mora imati najmanje 6 znakova.');

    btn.disabled = true; btn.textContent = 'Kreiranje naloga...';

    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (!res.ok) {
        showErr('registerError', data.error || 'Greška pri registraciji.');
        btn.disabled = false; btn.textContent = 'Napravi nalog';
        return;
      }
      if (data.session) {
        await sb.auth.setSession({ access_token: data.session.access_token, refresh_token: data.session.refresh_token });
        setCookie(data.session.refresh_token);
        location.href = returnUrl;
      } else {
        document.getElementById('registerSuccess').textContent = data.message || 'Nalog kreiran! Prijavi se.';
        document.getElementById('registerSuccess').style.display = 'block';
        btn.disabled = false; btn.textContent = 'Napravi nalog';
      }
    } catch (_) {
      showErr('registerError', 'Greška. Pokušaj ponovo.');
      btn.disabled = false; btn.textContent = 'Napravi nalog';
    }
  });
</script>

</body>
</html>
